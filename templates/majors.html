{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>专业管理</h1>
        <a href="{{ url_for('create_major') }}" class="btn btn-primary">
            <i class="fas fa-plus"></i> 添加专业
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>专业名称</th>
                            <th>所属院系</th>
                            <th>创建时间</th>
                            <th class="text-end">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for major in majors %}
                        <tr>
                            <td>{{ major.id }}</td>
                            <td>{{ major.name }}</td>
                            <td>{{ major.department.name }}</td>
                            <td>{{ major.created_at.strftime('%Y-%m-%d') }}</td>
                            <td class="text-end">
                                <a href="{{ url_for('classes') }}?major_id={{ major.id }}" 
                                   class="btn btn-sm btn-info me-1">查看班级</a>
                                <a href="{{ url_for('delete_major', id=major.id) }}" 
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('确定要删除该专业吗？该操作将无法恢复！')">删除</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
