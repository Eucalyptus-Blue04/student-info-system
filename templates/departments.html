{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>院系管理</h1>
        <a href="{{ url_for('create_department') }}" class="btn btn-primary">添加院系</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>院系名称</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for department in departments %}
                <tr>
                    <td>{{ department.id }}</td>
                    <td>{{ department.name }}</td>
                    <td>{{ department.created_at.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <div class="btn-group">
                            <a href="{{ url_for('majors') }}?department_id={{ department.id }}" 
                               class="btn btn-sm btn-info me-1">查看专业</a>
                            <a href="{{ url_for('delete_department', id=department.id) }}" 
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('确定要删除该院系吗？这将无法恢复！')">删除</a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
