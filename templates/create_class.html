{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="mb-4">
        <div class="d-sm-flex align-items-center justify-content-between">
            <div>
                <h2 class="h3 mb-0 text-gray-800">创建新班级</h2>
                <p class="mb-0 text-muted">创建一个新的班级信息</p>
            </div>
            <div class="mt-3 mt-sm-0">
                <a href="{{ url_for('classes') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i>返回列表
                </a>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form method="post" class="needs-validation" novalidate>
                        <div class="mb-4">
                            <label for="class_no" class="form-label small text-uppercase text-muted mb-2">班号</label>
                            <input type="number" class="form-control form-control-lg" 
                                   id="class_no" name="class_no" required min="1" max="99"
                                   placeholder="请输入1-99之间的数字">
                            <div class="form-text">系统将根据年级、专业和班号自动生成完整的班级名称</div>
                        </div>
                        
                        <input type="hidden" id="name" name="name">

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="grade_id" class="form-label small text-uppercase text-muted mb-2">年级</label>
                                <select class="form-select form-select-lg" id="grade_id" name="grade_id" required>
                                    <option value="">请选择年级</option>
                                    {% for grade in grades %}
                                    <option value="{{ grade.id }}">{{ grade.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-4">
                                <label for="major_id" class="form-label small text-uppercase text-muted mb-2">专业</label>
                                <select class="form-select form-select-lg" id="major_id" name="major_id" required>
                                    <option value="">请选择专业</option>
                                    {% for major in majors %}
                                    <option value="{{ major.id }}">{{ major.department.name }} - {{ major.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="teacher_id" class="form-label small text-uppercase text-muted mb-2">班主任/辅导员</label>
                            <select class="form-select form-select-lg" id="teacher_id" name="teacher_id">
                                <option value="">请选择教师</option>
                                {% for teacher in teachers %}
                                <option value="{{ teacher.id }}">{{ teacher.real_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex justify-content-end mt-5">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="fas fa-plus-circle me-2"></i>创建班级
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 添加CSS样式 -->
<style>
.form-control,
.form-select {
    border: 1px solid #e2e8f0;
    padding: 0.75rem 1rem;
}

.form-control:focus,
.form-select:focus {
    border-color: #4a5568;
    box-shadow: 0 0 0 2px rgba(74, 85, 104, 0.2);
}

.form-text {
    color: #718096;
    font-size: 0.875rem;
    margin-top: 0.5rem;
}

.btn-lg {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
}

.card {
    border: none;
    border-radius: 0.5rem;
}

.card-body {
    padding: 2rem;
}

.form-label {
    font-weight: 500;
    margin-bottom: 0.5rem;
}

.was-validated .form-control:invalid,
.was-validated .form-select:invalid {
    border-color: #e53e3e;
}

.was-validated .form-control:valid,
.was-validated .form-select:valid {
    border-color: #38a169;
}
</style>

<!-- 添加表单验证和班级名称生成 -->
<script>
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()

// 根据专业、年级和班号生成班级名称
function updateClassName() {
    const majorSelect = document.getElementById('major_id');
    const gradeSelect = document.getElementById('grade_id');
    const classNoInput = document.getElementById('class_no');
    const nameInput = document.getElementById('name');

    if (majorSelect.value && gradeSelect.value && classNoInput.value) {
        const majorOption = majorSelect.options[majorSelect.selectedIndex];
        const gradeOption = gradeSelect.options[gradeSelect.selectedIndex];
        const classNo = classNoInput.value.padStart(2, '0');
        
        const majorName = majorOption.text.split(' - ')[1]; // 获取专业名称
        const gradeName = gradeOption.text.replace('级', ''); // 去掉"级"字
        
        // 生成班级名称：例如"2023软件1班"
        nameInput.value = `${gradeName}${majorName}${classNo}班`;
    }
}

// 添加事件监听
document.addEventListener('DOMContentLoaded', function() {
    const majorSelect = document.getElementById('major_id');
    const gradeSelect = document.getElementById('grade_id');
    const classNoInput = document.getElementById('class_no');

    majorSelect.addEventListener('change', updateClassName);
    gradeSelect.addEventListener('change', updateClassName);
    classNoInput.addEventListener('input', updateClassName);
});
</script>
{% endblock %}
