{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>创建年级</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label for="year" class="form-label">年份</label>
                            <input type="number" class="form-control" id="year" name="year" required min="2000" max="2100">
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">年级名称</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="例如：2025级">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">创建年级</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
