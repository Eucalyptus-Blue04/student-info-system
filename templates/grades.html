{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>年级管理</h1>
        <a href="{{ url_for('create_grade') }}" class="btn btn-primary">创建年级</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>年级</th>
                    <th>名称</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for grade in grades %}
                <tr>
                    <td>{{ grade.year }}</td>
                    <td>{{ grade.name }}</td>
                    <td>{{ grade.created_at.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <a href="{{ url_for('classes') }}?grade_id={{ grade.id }}" class="btn btn-sm btn-info">查看班级</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
